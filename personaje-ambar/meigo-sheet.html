<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Display; src: url(fonts/display-italic.ttf); font-style: italic; font-weight: 400 900; }
@font-face { font-family: Display; src: url(fonts/display.ttf); font-weight: 400 900; }
@font-face { font-family: UI; src: url(fonts/ui-bold.woff2); font-weight: 700; }
body{margin:0;background:#0C0907}</style></head><body><canvas id="c" width="2400" height="1100"></canvas>
<script type="module">
import { drawMeiga } from './meiga.js';
await document.fonts.load('italic 600 44px Display'); await document.fonts.load('700 40px UI');
const c = document.getElementById('c').getContext('2d');
c.fillStyle='#0C0907'; c.fillRect(0,0,2400,1100);
const g=c.createRadialGradient(1200,500,100,1200,550,1300); g.addColorStop(0,'rgba(227,170,100,0.16)'); g.addColorStop(1,'rgba(227,170,100,0)'); c.fillStyle=g; c.fillRect(0,0,2400,1100);
const poses = [
 ['Neutral', {}],
 ['¡Eh, tú!', { armL:[1.4,0.1], handL:'point', lookX:-0.6, brow:0.6, mouth:{open:0.5, smile:0.7} }],
 ['¡Hoy empieza!', { happy:1, armL:[2.4,0.3], armR:[2.0,0.4], spray:1, mouth:{open:0.8, smile:1}, hop:30 }],
 ['¿Cuál elegir?', { armL:[0.9,2.3], lookY:-0.7, lookX:-0.4, brow:-0.3, browUp:0.6, mouth:{open:0.2, round:1} }],
 ['¡Corre!', { sweat:1, brow:-0.7, browUp:0.8, armL:[2.5,0.2], armR:[2.4,0.2], mouth:{open:0.9, round:0.9, smile:-0.3}, step:0.25 }],
 ['Guiño', { wink:1, armL:[1.3,1.6], mouth:{smile:0.9} }],
];
poses.forEach(([name,S],i)=>{
  const x=210+i*396, y=930;
  c.save(); c.translate(x,y); c.scale(0.9,0.9); drawMeiga(c,{t:i*0.7,...S}); c.restore();
  c.fillStyle='#E3AA64'; c.font='700 32px UI'; c.textAlign='center'; c.letterSpacing='4px'; c.fillText(name.toUpperCase(),x,1030);
});
window.done=true;
</script></body></html>
